name: Android verification

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Prepare build-only Firebase configuration
        run: cp app/google-services.json.example app/google-services.json
      - name: Check repository documentation
        run: python3 scripts/check-repository.py
      - name: Build, test and lint
        run: >-
          ./gradlew --no-daemon --max-workers=2 --continue
          :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
          :app:assembleRelease
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-verification-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
