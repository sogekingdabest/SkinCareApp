plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

def releaseVersionCode = providers.gradleProperty('appVersionCode').orElse('1').get().toInteger()
def releaseVersionName = providers.gradleProperty('appVersionName').orElse('1.0').get()
if (releaseVersionCode < 1 || releaseVersionCode > 2100000000) {
    throw new GradleException('appVersionCode must be between 1 and 2100000000')
}
def signingEnvironment = [
    'SKINCARE_RELEASE_STORE_FILE', 'SKINCARE_RELEASE_STORE_PASSWORD',
    'SKINCARE_RELEASE_KEY_ALIAS', 'SKINCARE_RELEASE_KEY_PASSWORD'
].collectEntries { name -> [(name): providers.environmentVariable(name).orNull] }
def hasReleaseSigning = signingEnvironment.values().every { it }
if (signingEnvironment.values().any { it } && !hasReleaseSigning) {
    throw new GradleException('Release signing requires all four SKINCARE_RELEASE signing values')
}

android {
    namespace 'com.monsteraltech.skincare'
    compileSdk 34

    defaultConfig {
        applicationId "com.monsteraltech.skincare"
        minSdk 29
        targetSdk 34
        versionCode releaseVersionCode
        versionName releaseVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            create('githubRelease') {
                storeFile file(signingEnvironment['SKINCARE_RELEASE_STORE_FILE'])
                storePassword signingEnvironment['SKINCARE_RELEASE_STORE_PASSWORD']
                keyAlias signingEnvironment['SKINCARE_RELEASE_KEY_ALIAS']
                keyPassword signingEnvironment['SKINCARE_RELEASE_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "CAPTURE_VALIDITY_MODEL_ENABLED", "true"
        }
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.githubRelease
            buildConfigField "boolean", "CAPTURE_VALIDITY_MODEL_ENABLED", "false"
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    testOptions {
        // android.util.Log y similares devuelven valores por defecto en tests JVM
        unitTests.returnDefaultValues = true
    }
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Inyección de dependencias
    implementation 'com.google.dagger:hilt-android:2.51.1'
    ksp 'com.google.dagger:hilt-compiler:2.51.1'

    // Unificar versiones de lifecycle
    def lifecycle_version = "2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"

    // Persistencia local de los datos de salud. Se mantiene en el dispositivo.
    // 2.6.1 es la última rama compatible con el toolchain Kotlin 1.9 del proyecto.
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // CameraX core library using the camera2 implementation
    def camerax_version = "1.4.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    // CameraX expone ListenableFuture; antes llegaba transitivamente desde Firebase Storage.
    implementation 'com.google.guava:guava:31.0.1-android'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    //Firebase Google
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-auth'

    // Login con Google moderno (Credential Manager; sustituye a play-services-auth)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Para la compresión de imágenes
    implementation 'id.zelory:compressor:3.0.1'

    // Para serialización JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'

    // LiteRT: sucesor de TensorFlow Lite. Interpreter ejecuta el modelo .tflite en CPU.
    implementation 'com.google.ai.edge.litert:litert:1.4.2'

    // OpenCV (artefacto oficial de Maven Central; ya no requiere importar el SDK a mano)
    implementation 'org.opencv:opencv:4.12.0'

    // Tests JVM: JUnit, MockK y dispatchers virtuales para coroutines.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'io.mockk:mockk:1.13.4'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
}
